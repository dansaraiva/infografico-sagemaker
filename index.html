  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

order-radius:14px\"><div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:40px;line-height:1;color:#F2A93B\">US$ 200<\u002Fdiv><div style=\"font-size:14px;line-height:1.4;color:#D6E6E5\">em créditos para novas contas: US$ 100 ao criar e até US$ 100 em atividades<\u002Fdiv><\u002Fdiv><div style=\"flex:1 1 200px;min-width:0;display:flex;flex-direction:column;gap:2px;padding:18px 22px;border:1px solid #2C4A48;border-radius:14px\"><div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:40px;line-height:1;color:#F2A93B\">6 meses<\u002Fdiv><div style=\"font-size:14px;line-height:1.4;color:#D6E6E5\">de duração do plano gratuito, ou até os créditos acabarem<\u002Fdiv><\u002Fdiv><div style=\"flex:1 1 200px;min-width:0;display:flex;flex-direction:column;gap:2px;padding:18px 22px;border:1px solid #2C4A48;border-radius:14px\"><div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:40px;line-height:1;color:#F2A93B\">90 dias<\u002Fdiv><div style=\"font-size:14px;line-height:1.4;color:#D6E6E5\">para reativar a conta com upgrade, depois que o plano gratuito termina<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px\"><div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:34px;line-height:1.1;color:#10201F\">O que é o Amazon SageMaker<\u002Fdiv><div style=\"font-size:16px;color:#48605E;line-height:1.5;max-width:720px\">Serviço da AWS para construir, treinar e implantar modelos de machine learning e aplicações de IA, com a infraestrutura gerenciada pela AWS.<\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-wrap:wrap;gap:16px\">\n<div style=\"flex:1 1 420px;min-width:0;display:flex;flex-direction:column;gap:6px;background:#FFFFFF;border:1px solid #C4D3D1;border-radius:14px;padding:20px 22px\"><div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:20px;color:#10201F\">SageMaker AI<\u002Fdiv><div style=\"font-size:15px;line-height:1.5;color:#48605E\">Ambiente para o ciclo completo de modelos: Studio (IDE no navegador), notebooks, treinamento distribuído, implantação, MLOps e Canvas para quem não programa.<\u002Fdiv><\u002Fdiv>\n<div style=\"flex:1 1 420px;min-width:0;display:flex;flex-direction:column;gap:6px;background:#FFFFFF;border:1px solid #C4D3D1;border-radius:14px;padding:20px 22px\"><div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:20px;color:#10201F\">SageMaker Unified Studio<\u002Fdiv><div style=\"font-size:15px;line-height:1.5;color:#48605E\">Um único ambiente para dados, análise e IA: notebook com agente de IA, SQL, processamento de dados, catálogo com governança e lakehouse.<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"background:#0B6E6D;color:#fff;border-radius:20px;padding:34px 40px;display:flex;flex-direction:column;gap:8px\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#BFE3E1\">Fase 1 · 10 passos<\u002Fdiv><div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:44px;line-height:1.05\">Criar a conta na AWS<\u002Fdiv><div style=\"font-size:17px;line-height:1.5;color:#D6E6E5;max-width:760px\">Do cadastro à conta protegida. Faça uma vez e use para qualquer serviço.<\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column\"><div style=\"display:flex;gap:24px;align-items:stretch\">\n<div style=\"width:52px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:8px\">\n<div style=\"width:52px;height:52px;border-radius:26px;background:#0B6E6D;color:#fff;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:24px;display:flex;align-items:center;justify-content:center\">1<\u002Fdiv><div style=\"width:2px;flex-grow:1;background:#C4D3D1\"><\u002Fdiv><\u002Fdiv>\n<div style=\"flex-grow:1;min-width:0;margin-bottom:24px;background:#FFFFFF;border:1px solid #C4D3D1;border-radius:16px;padding:26px 30px;display:flex;flex-direction:column;gap:12px\">\n<div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:26px;line-height:1.15;color:#10201F\">Reúna o que a AWS vai pedir<\u002Fdiv>\n<div style=\"font-size:16px;line-height:1.6;color:#48605E\">Separe tudo antes de abrir o cadastro. O processo leva alguns minutos, mas a AWS interrompe se faltar um dado, principalmente o cartão e o telefone.<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:6px\"><div style=\"display:flex;gap:10px;font-size:15px;line-height:1.5;color:#10201F\"><span style=\"flex-shrink:0;width:6px;height:6px;margin-top:8px;background:#0B6E6D\"><\u002Fspan><span>E-mail que você consulta com frequência (será o e-mail do usuário raiz)<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:10px;font-size:15px;line-height:1.5;color:#10201F\"><span style=\"flex-shrink:0;width:6px;height:6px;margin-top:8px;background:#0B6E6D\"><\u002Fspan><span>Cartão de crédito ou débito com compras internacionais habilitadas<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:10px;font-size:15px;line-height:1.5;color:#10201F\"><span style=\"flex-shrink:0;width:6px;height:6px;margin-top:8px;background:#0B6E6D\"><\u002Fspan><span>Celular ou telefone que você atende nos próximos minutos<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:10px;font-size:15px;line-height:1.5;color:#10201F\"><span style=\"flex-shrink:0;width:6px;height:6px;margin-top:8px;background:#0B6E6D\"><\u002Fspan><span>Endereço de cobrança e, se possível, um app autenticador para o MFA<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:6px;padding-top:6px;border-top:1px dashed #C4D3D1\"><a href=\"https://docs.aws.amazon.com/accounts/latest/reference/manage-acct-creating.html\" style=\"display:flex;gap:8px;align-items:baseline;font-family:'IBM Plex Mono',monospace;font-size:13px;line-height:1.4;color:#0B6E6D;text-decoration:underline;word-break:break-all\"><span style=\"font-weight:600;flex-shrink:0\">Requisitos e guia oficial<\u002Fspan><span style=\"color:#48605E\">docs.aws.amazon.com/accounts/latest/reference/manage-acct-creating.html<\u002Fspan><\u002Fa><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:24px;align-items:stretch\">\n<div style=\"width:52px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:8px\">\n<div style=\"width:52px;height:52px;border-radius:26px;background:#0B6E6D;color:#fff;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:24px;display:flex;align-items:center;justify-content:center\">2<\u002Fdiv><div style=\"width:2px;flex-grow:1;background:#C4D3D1\"><\u002Fdiv><\u002Fdiv>\n<div style=\"flex-grow:1;min-width:0;margin-bottom:24px;background:#FFFFFF;border:1px solid #C4D3D1;border-radius:16px;padding:26px 30px;display:flex;flex-direction:column;gap:12px\">\n<div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:26px;line-height:1.15;color:#10201F\">Abra a página de cadastro<\u002Fdiv>\n<div style=\"font-size:16px;line-height:1.6;color:#48605E\">Use sempre um endereço oficial da AWS. Na página do Free Tier, clique em <b>Create free account<\u002Fb> (Criar conta gratuita).<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:6px\"><div style=\"display:flex;gap:10px;font-size:15px;line-height:1.5;color:#10201F\"><span style=\"flex-shrink:0;width:6px;height:6px;margin-top:8px;background:#0B6E6D\"><\u002Fspan><span>Endereço oficial: aws.amazon.com/free ou o link direto de cadastro<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:10px;font-size:15px;line-height:1.5;color:#10201F\"><span style=\"flex-shrink:0;width:6px;height:6px;margin-top:8px;background:#0B6E6D\"><\u002Fspan><span>Confira o domínio amazon.com na barra do navegador antes de digitar qualquer dado<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:6px;padding-top:6px;border-top:1px dashed #C4D3D1\"><a href=\"https://aws.amazon.com/free/\" style=\"display:flex;gap:8px;align-items:baseline;font-family:'IBM Plex Mono',monospace;font-size:13px;line-height:1.4;color:#0B6E6D;text-decoration:underline;word-break:break-all\"><span style=\"font-weight:600;flex-shrink:0\">Página do Free Tier<\u002Fspan><span style=\"color:#48605E\">aws.amazon.com/free/<\u002Fspan><\u002Fa><a href=\"https://signin.aws.amazon.com/signup?request_type=register\" style=\"display:flex;gap:8px;align-items:baseline;font-family:'IBM Plex Mono',monospace;font-size:13px;line-height:1.4;color:#0B6E6D;text-decoration:underline;word-break:break-all\"><span style=\"font-weight:600;flex-shrink:0\">Cadastro direto<\u002Fspan><span style=\"color:#48605E\">signin.aws.amazon.com/signup?request_type=register<\u002Fspan><\u002Fa><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:24px;align-items:stretch\">\n<div style=\"width:52px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:8px\">\n<div style=\"width:52px;height:52px;border-radius:26px;background:#0B6E6D;color:#fff;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:24px;display:flex;align-items:center;justify-content:center\">3<\u002Fdiv><div style=\"width:2px;flex-grow:1;background:#C4D3D1\"><\u002Fdiv><\u002Fdiv>\n<div style=\"flex-grow:1;min-width:0;margin-bottom:24px;background:#FFFFFF;border:1px solid #C4D3D1;border-radius:16px;padding:26px 30px;display:flex;flex-direction:column;gap:12px\">\n<div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:26px;line-height:1.15;color:#10201F\">Informe e-mail e nome da conta<\u002Fdiv>\n<div style=\"font-size:16px;line-height:1.6;color:#48605E\">Digite o e-mail do usuário raiz e um nome para a conta (por exemplo, <i>Estudos SageMaker<\u002Fi>). Clique em <b>Verify email address<\u002Fb>. A AWS envia um código ao e-mail; digite-o e clique em <b>Verify<\u002Fb>.<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:6px\"><div style=\"display:flex;gap:10px;font-size:15px;line-height:1.5;color:#10201F\"><span style=\"flex-shrink:0;width:6px;height:6px;margin-top:8px;background:#0B6E6D\"><\u002Fspan><span>O nome da conta pode ser mudado depois<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:10px;font-size:15px;line-height:1.5;color:#10201F\"><span style=\"flex-shrink:0;width:6px;height:6px;margin-top:8px;background:#0B6E6D\"><\u002Fspan><span>Se o código não chegar, olhe a caixa de spam<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:6px;padding-top:6px;border-top:1px dashed #C4D3D1\"><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:24px;align-items:stretch\">\n<div style=\"width:52px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:8px\">\n<div style=\"width:52px;height:52px;border-radius:26px;background:#0B6E6D;color:#fff;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:24px;display:flex;align-items:center;justify-content:center\">4<\u002Fdiv><div style=\"width:2px;flex-grow:1;background:#C4D3D1\"><\u002Fdiv><\u002Fdiv>\n<div style=\"flex-grow:1;min-width:0;margin-bottom:24px;background:#FFFFFF;border:1px solid #C4D3D1;border-radius:16px;padding:26px 30px;display:flex;flex-direction:column;gap:12px\">\n<div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:26px;line-height:1.15;color:#10201F\">Crie a senha do usuário raiz<\u002Fdiv>\n<div style=\"font-size:16px;line-height:1.6;color:#48605E\">Escolha uma senha forte, confirme e clique em <b>Continue<\u002Fb>.<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:6px\"><div style=\"display:flex;gap:10px;font-size:15px;line-height:1.5;color:#10201F\"><span style=\"flex-shrink:0;width:6px;height:6px;margin-top:8px;background:#0B6E6D\"><\u002Fspan><span>Entre 8 e 128 caracteres<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:10px;font-size:15px;line-height:1.5;color:#10201F\"><span style=\"flex-shrink:0;width:6px;height:6px;margin-top:8px;background:#0B6E6D\"><\u002Fspan><span>Pelo menos 3 tipos: maiúsculas, minúsculas, números e símbolos<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:10px;font-size:15px;line-height:1.5;color:#10201F\"><span style=\"flex-shrink:0;width:6px;height:6px;margin-top:8px;background:#0B6E6D\"><\u002Fspan><span>Diferente do nome da conta e do e-mail<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:6px;padding-top:6px;border-top:1px dashed #C4D3D1\"><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:24px;align-items:stretch\">\n<div style=\"width:52px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:8px\">\n<div style=\"width:52px;height:52px;border-radius:26px;background:#0B6E6D;color:#fff;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:24px;display:flex;align-items:center;justify-content:center\">5<\u002Fdiv><div style=\"width:2px;flex-grow:1;background:#C4D3D1\"><\u002Fdiv><\u002Fdiv>\n<div style=\"flex-grow:1;min-width:0;margin-bottom:24px;background:#FFFFFF;border:1px solid #C4D3D1;border-radius:16px;padding:26px 30px;display:flex;flex-direction:column;gap:12px\">\n<div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:26px;line-height:1.15;color:#10201F\">Escolha o tipo de conta e preencha seus dados<\u002Fdiv>\n<div style=\"font-size:16px;line-height:1.6;color:#48605E\">Selecione <b>Personal<\u002Fb> (pessoal) ou <b>Business<\u002Fb> (profissional). As duas têm os mesmos recursos. Preencha nome, telefone, país e endereço e aceite o Contrato do Cliente AWS.<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:6px\"><div style=\"display:flex;gap:10px;font-size:15px;line-height:1.5;color:#10201F\"><span style=\"flex-shrink:0;width:6px;height:6px;margin-top:8px;background:#0B6E6D\"><\u002Fspan><span>Conta de estudo: Personal funciona bem<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:10px;font-size:15px;line-height:1.5;color:#10201F\"><span style=\"flex-shrink:0;width:6px;height:6px;margin-top:8px;background:#0B6E6D\"><\u002Fspan><span>Conta de empresa ou escola: use um e-mail e um telefone institucionais, para que a conta não fique presa a uma pessoa<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:6px;padding-top:6px;border-top:1px dashed #C4D3D1\"><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:24px;align-items:stretch\">\n<div style=\"width:52px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:8px\">\n<div style=\"width:52px;height:52px;border-radius:26px;background:#0B6E6D;color:#fff;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:24px;display:flex;align-items:center;justify-content:center\">6<\u002Fdiv><div style=\"width:2px;flex-grow:1;background:#C4D3D1\"><\u002Fdiv><\u002Fdiv>\n<div style=\"flex-grow:1;min-width:0;margin-bottom:24px;background:#FFFFFF;border:1px solid #C4D3D1;border-radius:16px;padding:26px 30px;display:flex;flex-direction:column;gap:12px\">\n<div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:26px;line-height:1.15;color:#10201F\">Cadastre a forma de pagamento<\u002Fdiv>\n<div style=\"font-size:16px;line-height:1.6;color:#48605E\">Informe os dados do cartão e clique em <b>Verify and Continue<\u002Fb>. Sem um cartão válido não é possível avançar. A AWS pode fazer uma cobrança pequena e temporária só para validar o cartão.<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:6px\"><div style=\"display:flex;gap:10px;font-size:15px;line-height:1.5;color:#10201F\"><span style=\"flex-shrink:0;width:6px;height:6px;margin-top:8px;background:#0B6E6D\"><\u002Fspan><span>O cartão é exigido mesmo no plano gratuito<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:10px;font-size:15px;line-height:1.5;color:#10201F\"><span style=\"flex-shrink:0;width:6px;height:6px;margin-top:8px;background:#0B6E6D\"><\u002Fspan><span>No plano gratuito, o uso é coberto pelos créditos; nada é cobrado do cartão<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:6px;padding-top:6px;border-top:1px dashed #C4D3D1\"><a href=\"https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/free-tier.html\" style=\"display:flex;gap:8px;align-items:baseline;font-family:'IBM Plex Mono',monospace;font-size:13px;line-height:1.4;color:#0B6E6D;text-decoration:underline;word-break:break-all\"><span style=\"font-weight:600;flex-shrink:0\">Como funciona o Free Tier<\u002Fspan><span style=\"color:#48605E\">docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/free-tier.html<\u002Fspan><\u002Fa><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:24px;align-items:stretch\">\n<div style=\"width:52px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:8px\">\n<div style=\"width:52px;height:52px;border-radius:26px;background:#0B6E6D;color:#fff;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:24px;display:flex;align-items:center;justify-content:center\">7<\u002Fdiv><div style=\"width:2px;flex-grow:1;background:#C4D3D1\"><\u002Fdiv><\u002Fdiv>\n<div style=\"flex-grow:1;min-width:0;margin-bottom:24px;background:#FFFFFF;border:1px solid #C4D3D1;border-radius:16px;padding:26px 30px;display:flex;flex-direction:column;gap:12px\">\n<div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:26px;line-height:1.15;color:#10201F\">Confirme sua identidade por telefone<\u002Fdiv>\n<div style=\"font-size:16px;line-height:1.6;color:#48605E\">Escolha o país, digite o número, resolva o CAPTCHA e envie. O sistema automático liga ou manda uma mensagem com um PIN; digite o PIN na tela.<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:6px\"><div style=\"display:flex;gap:10px;font-size:15px;line-height:1.5;color:#10201F\"><span style=\"flex-shrink:0;width:6px;height:6px;margin-top:8px;background:#0B6E6D\"><\u002Fspan><span>Fique com o telefone por perto durante esta etapa<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:10px;font-size:15px;line-height:1.5;color:#10201F\"><span style=\"flex-shrink:0;width:6px;height:6px;margin-top:8px;background:#0B6E6D\"><\u002Fspan><span>Número errado ou sem sinal é a causa mais comum de travamento aqui<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:6px;padding-top:6px;border-top:1px dashed #C4D3D1\"><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:24px;align-items:stretch\">\n<div style=\"width:52px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:8px\">\n<div style=\"width:52px;height:52px;border-radius:26px;background:#0B6E6D;color:#fff;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:24px;display:flex;align-items:center;justify-content:center\">8<\u002Fdiv><div style=\"width:2px;flex-grow:1;background:#C4D3D1\"><\u002Fdiv><\u002Fdiv>\n<div style=\"flex-grow:1;min-width:0;margin-bottom:24px;background:#FFFFFF;border:1px solid #C4D3D1;border-radius:16px;padding:26px 30px;display:flex;flex-direction:column;gap:12px\">\n<div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:26px;line-height:1.15;color:#10201F\">Escolha o plano da conta e o suporte<\u002Fdiv>\n<div style=\"font-size:16px;line-height:1.6;color:#48605E\">Você vai escolher entre <b>Free account plan<\u002Fb> e <b>Paid account plan<\u002Fb>, e depois o plano de suporte. Para estudar, selecione o plano gratuito e o suporte <b>Basic (gratuito)<\u002Fb>.<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:6px\"><div style=\"display:flex;gap:10px;font-size:15px;line-height:1.5;color:#10201F\"><span style=\"flex-shrink:0;width:6px;height:6px;margin-top:8px;background:#0B6E6D\"><\u002Fspan><span>Free plan: até US$ 200 em créditos (US$ 100 ao criar a conta e até US$ 100 ao concluir atividades)<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:10px;font-size:15px;line-height:1.5;color:#10201F\"><span style=\"flex-shrink:0;width:6px;height:6px;margin-top:8px;background:#0B6E6D\"><\u002Fspan><span>Termina em 6 meses ou quando os créditos acabarem, o que vier primeiro<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:10px;font-size:15px;line-height:1.5;color:#10201F\"><span style=\"flex-shrink:0;width:6px;height:6px;margin-top:8px;background:#0B6E6D\"><\u002Fspan><span>Paid plan: acesso completo aos serviços; você paga o que passar dos créditos<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:10px;font-size:15px;line-height:1.5;color:#10201F\"><span style=\"flex-shrink:0;width:6px;height:6px;margin-top:8px;background:#0B6E6D\"><\u002Fspan><span>Não dá para voltar do plano pago para o gratuito<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:6px;padding-top:6px;border-top:1px dashed #C4D3D1\"><a href=\"https://aws.amazon.com/free/free-tier-faqs/\" style=\"display:flex;gap:8px;align-items:baseline;font-family:'IBM Plex Mono',monospace;font-size:13px;line-height:1.4;color:#0B6E6D;text-decoration:underline;word-break:break-all\"><span style=\"font-weight:600;flex-shrink:0\">Perguntas frequentes do Free Tier<\u002Fspan><span style=\"color:#48605E\">aws.amazon.com/free/free-tier-faqs/<\u002Fspan><\u002Fa><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:24px;align-items:stretch\">\n<div style=\"width:52px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:8px\">\n<div style=\"width:52px;height:52px;border-radius:26px;background:#0B6E6D;color:#fff;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:24px;display:flex;align-items:center;justify-content:center\">9<\u002Fdiv><div style=\"width:2px;flex-grow:1;background:#C4D3D1\"><\u002Fdiv><\u002Fdiv>\n<div style=\"flex-grow:1;min-width:0;margin-bottom:24px;background:#FFFFFF;border:1px solid #C4D3D1;border-radius:16px;padding:26px 30px;display:flex;flex-direction:column;gap:12px\">\n<div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:26px;line-height:1.15;color:#10201F\">Aguarde a ativação e entre no console<\u002Fdiv>\n<div style=\"font-size:16px;line-height:1.6;color:#48605E\">Clique em <b>Complete sign up<\u002Fb>. A AWS envia um e-mail quando a conta estiver ativa. Costuma levar alguns minutos e, em casos raros, até 24 horas. Depois, entre com o e-mail e a senha do usuário raiz.<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:6px\"><div style=\"display:flex;gap:10px;font-size:15px;line-height:1.5;color:#10201F\"><span style=\"flex-shrink:0;width:6px;height:6px;margin-top:8px;background:#0B6E6D\"><\u002Fspan><span>Use a opção <b>Root user<\u002Fb> na tela de login<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:10px;font-size:15px;line-height:1.5;color:#10201F\"><span style=\"flex-shrink:0;width:6px;height:6px;margin-top:8px;background:#0B6E6D\"><\u002Fspan><span>Você só consegue usar os serviços depois da ativação<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:6px;padding-top:6px;border-top:1px dashed #C4D3D1\"><a href=\"https://console.aws.amazon.com/\" style=\"display:flex;gap:8px;align-items:baseline;font-family:'IBM Plex Mono',monospace;font-size:13px;line-height:1.4;color:#0B6E6D;text-decoration:underline;word-break:break-all\"><span style=\"font-weight:600;flex-shrink:0\">Console de gerenciamento<\u002Fspan><span style=\"color:#48605E\">console.aws.amazon.com/<\u002Fspan><\u002Fa><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:24px;align-items:stretch\">\n<div style=\"width:52px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:8px\">\n<div style=\"width:52px;height:52px;border-radius:26px;background:#0B6E6D;color:#fff;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:24px;display:flex;align-items:center;justify-content:center\">10<\u002Fdiv><\u002Fdiv>\n<div style=\"flex-grow:1;min-width:0;margin-bottom:24px;background:#FFFFFF;border:1px solid #C4D3D1;border-radius:16px;padding:26px 30px;display:flex;flex-direction:column;gap:12px\">\n<div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:26px;line-height:1.15;color:#10201F\">Proteja a conta antes de qualquer outra coisa<\u002Fdiv>\n<div style=\"font-size:16px;line-height:1.6;color:#48605E\">O usuário raiz tem poder total sobre a conta. Ative a verificação em duas etapas (MFA) e os alertas de uso, para não ter surpresa na fatura.<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:6px\"><div style=\"display:flex;gap:10px;font-size:15px;line-height:1.5;color:#10201F\"><span style=\"flex-shrink:0;width:6px;height:6px;margin-top:8px;background:#0B6E6D\"><\u002Fspan><span>No console, clique no nome da conta, depois em <b>Security credentials<\u002Fb> e ative o MFA com um app autenticador<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:10px;font-size:15px;line-height:1.5;color:#10201F\"><span style=\"flex-shrink:0;width:6px;height:6px;margin-top:8px;background:#0B6E6D\"><\u002Fspan><span>Em <b>Billing and Cost Management<\u002Fb>, abra <b>Billing Preferences<\u002Fb> e ative os alertas de uso do Free Tier<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:10px;font-size:15px;line-height:1.5;color:#10201F\"><span style=\"flex-shrink:0;width:6px;height:6px;margin-top:8px;background:#0B6E6D\"><\u002Fspan><span>Acompanhe créditos e data de expiração no widget <b>Cost and Usage<\u002Fb> da página inicial do console<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:6px;padding-top:6px;border-top:1px dashed #C4D3D1\"><a href=\"https://console.aws.amazon.com/billing/home\" style=\"display:flex;gap:8px;align-items:baseline;font-family:'IBM Plex Mono',monospace;font-size:13px;line-height:1.4;color:#0B6E6D;text-decoration:underline;word-break:break-all\"><span style=\"font-weight:600;flex-shrink:0\">Página de Billing<\u002Fspan><span style=\"color:#48605E\">console.aws.amazon.com/billing/home<\u002Fspan><\u002Fa><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px;background:#FFF1D0;border:1px solid #D9962B;border-radius:14px;padding:20px 26px;color:#4F3400\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:600\">Confira antes de seguir<\u002Fdiv><div style=\"font-size:16px;line-height:1.55\">O plano gratuito não libera alguns serviços que consumiriam todos os créditos de uma vez. Veja na página do Free Tier se o recurso do SageMaker que você quer usar está liberado. Se não estiver, o upgrade para o plano pago mantém os créditos restantes até expirarem (12 meses após a criação da conta).<\u002Fdiv><\u002Fdiv><div style=\"background:#10201F;color:#fff;border-radius:20px;padding:34px 40px;display:flex;flex-direction:column;gap:8px\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#BFE3E1\">Fase 2 · 5 passos<\u002Fdiv><div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:44px;line-height:1.05\">Acessar o SageMaker<\u002Fdiv><div style=\"font-size:17px;line-height:1.5;color:#D6E6E5;max-width:760px\">Com a conta ativa, o caminho mais curto para abrir o Studio é a configuração rápida para um único usuário.<\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column\"><div style=\"display:flex;gap:24px;align-items:stretch\">\n<div style=\"width:52px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:8px\">\n<div style=\"width:52px;height:52px;border-radius:26px;background:#10201F;color:#fff;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:24px;display:flex;align-items:center;justify-content:center\">1<\u002Fdiv><div style=\"width:2px;flex-grow:1;background:#C4D3D1\"><\u002Fdiv><\u002Fdiv>\n<div style=\"flex-grow:1;min-width:0;margin-bottom:24px;background:#FFFFFF;border:1px solid #C4D3D1;border-radius:16px;padding:26px 30px;display:flex;flex-direction:column;gap:12px\">\n<div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:26px;line-height:1.15;color:#10201F\">Abra o console e escolha a região<\u002Fdiv>\n<div style=\"font-size:16px;line-height:1.6;color:#48605E\">No campo de busca do topo, digite <b>SageMaker<\u002Fb> e escolha <b>Amazon SageMaker<\u002Fb>. Antes de configurar, escolha a região no seletor no canto superior direito. O ambiente que você criar fica preso a essa região.<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:6px\"><div style=\"display:flex;gap:10px;font-size:15px;line-height:1.5;color:#10201F\"><span style=\"flex-shrink:0;width:6px;height:6px;margin-top:8px;background:#10201F\"><\u002Fspan><span>Escolha uma região e use sempre a mesma nos estudos<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:10px;font-size:15px;line-height:1.5;color:#10201F\"><span style=\"flex-shrink:0;width:6px;height:6px;margin-top:8px;background:#10201F\"><\u002Fspan><span>Cada conta tem um domínio do SageMaker AI por região<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:6px;padding-top:6px;border-top:1px dashed #C4D3D1\"><a href=\"https://console.aws.amazon.com/sagemaker/\" style=\"display:flex;gap:8px;align-items:baseline;font-family:'IBM Plex Mono',monospace;font-size:13px;line-height:1.4;color:#0B6E6D;text-decoration:underline;word-break:break-all\"><span style=\"font-weight:600;flex-shrink:0\">Console do SageMaker AI<\u002Fspan><span style=\"color:#48605E\">console.aws.amazon.com/sagemaker/<\u002Fspan><\u002Fa><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:24px;align-items:stretch\">\n<div style=\"width:52px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:8px\">\n<div style=\"width:52px;height:52px;border-radius:26px;background:#10201F;color:#fff;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:24px;display:flex;align-items:center;justify-content:center\">2<\u002Fdiv><div style=\"width:2px;flex-grow:1;background:#C4D3D1\"><\u002Fdiv><\u002Fdiv>\n<div style=\"flex-grow:1;min-width:0;margin-bottom:24px;background:#FFFFFF;border:1px solid #C4D3D1;border-radius:16px;padding:26px 30px;display:flex;flex-direction:column;gap:12px\">\n<div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:26px;line-height:1.15;color:#10201F\">Escolha a experiência que você vai usar<\u002Fdiv>\n<div style=\"font-size:16px;line-height:1.6;color:#48605E\">O SageMaker novo reúne duas portas de entrada. Para aprender e treinar modelos, comece pelo <b>SageMaker AI<\u002Fb> com o Studio. O <b>Unified Studio<\u002Fb> serve quando você precisa juntar dados, análise e IA num só ambiente.<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:6px\"><div style=\"display:flex;gap:10px;font-size:15px;line-height:1.5;color:#10201F\"><span style=\"flex-shrink:0;width:6px;height:6px;margin-top:8px;background:#10201F\"><\u002Fspan><span><b>SageMaker AI<\u002Fb>: Studio, notebooks, treinamento e implantação de modelos, Canvas (sem código)<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:10px;font-size:15px;line-height:1.5;color:#10201F\"><span style=\"flex-shrink:0;width:6px;height:6px;margin-top:8px;background:#10201F\"><\u002Fspan><span><b>Unified Studio<\u002Fb>: notebook serverless com agente de IA, editor SQL, catálogo e lakehouse<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:6px;padding-top:6px;border-top:1px dashed #C4D3D1\"><a href=\"https://aws.amazon.com/sagemaker/ai/\" style=\"display:flex;gap:8px;align-items:baseline;font-family:'IBM Plex Mono',monospace;font-size:13px;line-height:1.4;color:#0B6E6D;text-decoration:underline;word-break:break-all\"><span style=\"font-weight:600;flex-shrink:0\">SageMaker AI<\u002Fspan><span style=\"color:#48605E\">aws.amazon.com/sagemaker/ai/<\u002Fspan><\u002Fa><a href=\"https://aws.amazon.com/sagemaker/unified-studio/\" style=\"display:flex;gap:8px;align-items:baseline;font-family:'IBM Plex Mono',monospace;font-size:13px;line-height:1.4;color:#0B6E6D;text-decoration:underline;word-break:break-all\"><span style=\"font-weight:600;flex-shrink:0\">Unified Studio<\u002Fspan><span style=\"color:#48605E\">aws.amazon.com/sagemaker/unified-studio/<\u002Fspan><\u002Fa><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:24px;align-items:stretch\">\n<div style=\"width:52px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:8px\">\n<div style=\"width:52px;height:52px;border-radius:26px;background:#10201F;color:#fff;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:24px;display:flex;align-items:center;justify-content:center\">3<\u002Fdiv><div style=\"width:2px;flex-grow:1;background:#C4D3D1\"><\u002Fdiv><\u002Fdiv>\n<div style=\"flex-grow:1;min-width:0;margin-bottom:24px;background:#FFFFFF;border:1px solid #C4D3D1;border-radius:16px;padding:26px 30px;display:flex;flex-direction:column;gap:12px\">\n<div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:26px;line-height:1.15;color:#10201F\">Faça a configuração rápida (Quick setup)<\u002Fdiv>\n<div style=\"font-size:16px;line-height:1.6;color:#48605E\">Na tela inicial do SageMaker AI, clique em <b>Set up for single user (Quick setup)<\u002Fb>. A AWS cria tudo com valores padrão e leva alguns minutos.<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:6px\"><div style=\"display:flex;gap:10px;font-size:15px;line-height:1.5;color:#10201F\"><span style=\"flex-shrink:0;width:6px;height:6px;margin-top:8px;background:#10201F\"><\u002Fspan><span>Cria um domínio e um perfil de usuário com nomes únicos<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:10px;font-size:15px;line-height:1.5;color:#10201F\"><span style=\"flex-shrink:0;width:6px;height:6px;margin-top:8px;background:#10201F\"><\u002Fspan><span>Cria uma role IAM com permissão para Studio, S3 e Canvas<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:10px;font-size:15px;line-height:1.5;color:#10201F\"><span style=\"flex-shrink:0;width:6px;height:6px;margin-top:8px;background:#10201F\"><\u002Fspan><span>Cria um bucket S3 chamado sagemaker-studio-XXXXXXXX<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:10px;font-size:15px;line-height:1.5;color:#10201F\"><span style=\"flex-shrink:0;width:6px;height:6px;margin-top:8px;background:#10201F\"><\u002Fspan><span>Escolhe uma VPC pública e define o Studio como interface padrão<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:6px;padding-top:6px;border-top:1px dashed #C4D3D1\"><a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/onboard-quick-start.html\" style=\"display:flex;gap:8px;align-items:baseline;font-family:'IBM Plex Mono',monospace;font-size:13px;line-height:1.4;color:#0B6E6D;text-decoration:underline;word-break:break-all\"><span style=\"font-weight:600;flex-shrink:0\">Guia: Quick setup<\u002Fspan><span style=\"color:#48605E\">docs.aws.amazon.com/sagemaker/latest/dg/onboard-quick-start.html<\u002Fspan><\u002Fa><a href=\"https://aws.amazon.com/blogs/machine-learning/amazon-sagemaker-simplifies-the-amazon-sagemaker-studio-setup-for-individual-users\" style=\"display:flex;gap:8px;align-items:baseline;font-family:'IBM Plex Mono',monospace;font-size:13px;line-height:1.4;color:#0B6E6D;text-decoration:underline;word-break:break-all\"><span style=\"font-weight:600;flex-shrink:0\">Blog: configuração em um clique<\u002Fspan><span style=\"color:#48605E\">aws.amazon.com/blogs/machine-learning/amazon-sagemaker-simplifies-the-amazon-sagemaker-studio-setup-for-individual-users<\u002Fspan><\u002Fa><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:24px;align-items:stretch\">\n<div style=\"width:52px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:8px\">\n<div style=\"width:52px;height:52px;border-radius:26px;background:#10201F;color:#fff;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:24px;display:flex;align-items:center;justify-content:center\">4<\u002Fdiv><div style=\"width:2px;flex-grow:1;background:#C4D3D1\"><\u002Fdiv><\u002Fdiv>\n<div style=\"flex-grow:1;min-width:0;margin-bottom:24px;background:#FFFFFF;border:1px solid #C4D3D1;border-radius:16px;padding:26px 30px;display:flex;flex-direction:column;gap:12px\">\n<div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:26px;line-height:1.15;color:#10201F\">Abra o SageMaker Studio<\u002Fdiv>\n<div style=\"font-size:16px;line-height:1.6;color:#48605E\">Quando o domínio estiver pronto, vá à página do Studio, selecione o domínio e o perfil de usuário e clique em <b>Open Studio<\u002Fb>. Em alguns painéis o botão se chama <b>Launch personal Studio<\u002Fb>.<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:6px\"><div style=\"display:flex;gap:10px;font-size:15px;line-height:1.5;color:#10201F\"><span style=\"flex-shrink:0;width:6px;height:6px;margin-top:8px;background:#10201F\"><\u002Fspan><span>A primeira abertura pode demorar um pouco<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:10px;font-size:15px;line-height:1.5;color:#10201F\"><span style=\"flex-shrink:0;width:6px;height:6px;margin-top:8px;background:#10201F\"><\u002Fspan><span>Daqui em diante você cria notebooks e executa o treinamento pelo navegador<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:6px;padding-top:6px;border-top:1px dashed #C4D3D1\"><a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/studio-updated-launch.html\" style=\"display:flex;gap:8px;align-items:baseline;font-family:'IBM Plex Mono',monospace;font-size:13px;line-height:1.4;color:#0B6E6D;text-decoration:underline;word-break:break-all\"><span style=\"font-weight:600;flex-shrink:0\">Guia: iniciar o Studio<\u002Fspan><span style=\"color:#48605E\">docs.aws.amazon.com/sagemaker/latest/dg/studio-updated-launch.html<\u002Fspan><\u002Fa><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:24px;align-items:stretch\">\n<div style=\"width:52px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:8px\">\n<div style=\"width:52px;height:52px;border-radius:26px;background:#10201F;color:#fff;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:24px;display:flex;align-items:center;justify-content:center\">5<\u002Fdiv><\u002Fdiv>\n<div style=\"flex-grow:1;min-width:0;margin-bottom:24px;background:#FFFFFF;border:1px solid #C4D3D1;border-radius:16px;padding:26px 30px;display:flex;flex-direction:column;gap:12px\">\n<div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:26px;line-height:1.15;color:#10201F\">Desligue o que não estiver em uso<\u002Fdiv>\n<div style=\"font-size:16px;line-height:1.6;color:#48605E\">Notebooks e instâncias ligados consomem créditos mesmo parados na tela. Ao terminar cada sessão, pare os aplicativos e as instâncias, e confira o custo na página de preços.<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:6px\"><div style=\"display:flex;gap:10px;font-size:15px;line-height:1.5;color:#10201F\"><span style=\"flex-shrink:0;width:6px;height:6px;margin-top:8px;background:#10201F\"><\u002Fspan><span>Pare os espaços (spaces) do Studio ao final da aula<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:10px;font-size:15px;line-height:1.5;color:#10201F\"><span style=\"flex-shrink:0;width:6px;height:6px;margin-top:8px;background:#10201F\"><\u002Fspan><span>Volte ao widget de créditos no console para ver quanto sobrou<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:6px;padding-top:6px;border-top:1px dashed #C4D3D1\"><a href=\"https://aws.amazon.com/sagemaker/pricing/\" style=\"display:flex;gap:8px;align-items:baseline;font-family:'IBM Plex Mono',monospace;font-size:13px;line-height:1.4;color:#0B6E6D;text-decoration:underline;word-break:break-all\"><span style=\"font-weight:600;flex-shrink:0\">Preços do SageMaker<\u002Fspan><span style=\"color:#48605E\">aws.amazon.com/sagemaker/pricing/<\u002Fspan><\u002Fa><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px;background:#DDEFEE;border:1px solid #0B6E6D;border-radius:14px;padding:20px 26px;color:#10201F\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:600\">Caminho alternativo: Unified Studio<\u002Fdiv><div style=\"font-size:16px;line-height:1.55\">Para o Unified Studio, abra o console em console.aws.amazon.com/datazone, escolha <b>Create a Unified Studio domain<\u002Fb> e use <b>Quick setup<\u002Fb>. Nessa opção você define um usuário do IAM Identity Center, que será o administrador; o e-mail dele recebe o link para criar a senha. Depois clique em <b>Create project<\u002Fb> e escolha o perfil <b>All capabilities<\u002Fb>.<\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px\"><div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:34px;line-height:1.1;color:#10201F\">Vídeos oficiais da AWS<\u002Fdiv><div style=\"font-size:16px;color:#48605E;line-height:1.5;max-width:720px\">Em inglês, publicados no AWS TV. Assista antes ou durante a Fase 2.<\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-wrap:wrap;gap:20px\"><div style=\"flex:1 1 380px;min-width:0;display:flex;flex-direction:column;gap:14px;background:#FFFFFF;border:1px solid #C4D3D1;border-radius:16px;padding:18px 18px 24px\">\n<div style=\"height:190px;border-radius:10px;background:#10201F;display:flex;align-items:center;justify-content:center;gap:16px\"><div style=\"width:0;height:0;border-top:22px solid transparent;border-bottom:22px solid transparent;border-left:36px solid #F2A93B\"><\u002Fdiv> ound:#FFF1D0;border:1px solid #D9962B;border-radius:14px;padding:20px 26px;color:#4F3400\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:600\">Como evitar cobrança inesperada<\u002Fdiv><div style=\"font-size:16px;line-height:1.55\">Ative os alertas de uso, pare notebooks e instâncias ao terminar, e acompanhe o saldo de créditos no console. Quando o plano gratuito termina, a AWS fecha a conta e mantém os dados por 90 dias; só com upgrade para o plano pago é possível reabrir e baixar os dados.<\u002Fdiv><\u002Fdiv><div style=\"font-size:13px;line-height:1.6;color:#48605E;padding:8px 0 0\">Fontes: documentação oficial da AWS (Account Management, Billing, SageMaker AI e Unified Studio), Free Tier FAQs e páginas do Amazon SageMaker e do AWS TV, consultadas em 29/09/2026. Regras de planos e telas do console mudam com frequência; confirme nas páginas oficiais.<\u002Fdiv><\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1080,&quot;height&quot;:7800}}\">\nclass Component extends DCLogic {\nrenderVals() { return {}; }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
